name: qrpix
description: Gerador de QR Code PIX estático em Flutter.
version: 0.2.1+3

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.0
  intl: ^0.20.0
  uuid: ^4.5.0
  share_plus: ^12.0.0
  path_provider: ^2.1.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F7FA"
  color_dark: "#0D1B2A"
  image: assets/images/tech7_qr_splash.png
  android_12:
    image: assets/images/tech7_qr_splash.png
    icon_background_color: "#F5F7FA"
    icon_background_color_dark: "#0D1B2A"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
